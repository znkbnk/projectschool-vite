    <!--
      CRITICAL CSS — inlined so the page renders instantly without waiting

      Keep this minimal — everything else loads from the stylesheet.

    <style>

      html {
        background: #080808;

      .loading-placeholder {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #61dafb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /*
        Navbar critical styles — prevents layout shift while JS loads.
        The full navbar CSS is in the main stylesheet but these rules
        stop the page jumping when the nav renders.
      */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--navbar-height);
        z-index: 9999;
        background: rgba(8, 8, 8, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      /*
        Hero background — rendered as a CSS background-image so the
        browser doesn't discover it from HTML. We preload it above.
        Adding fetchpriority via a <link rel=preload> is the correct
        way to prioritise CSS background images (Lighthouse Image 3 fix).
      */
      .hero-background-image {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: top center;
        background-repeat: no-repeat;
        opacity: 0.35;
        z-index: 0;
      }
    </style>

  });
</script>
